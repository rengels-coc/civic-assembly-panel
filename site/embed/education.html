.card .src{font-size:.75rem}
.pie.narrow,.legend{display:none}
.legend{list-style:none;margin:6px 0 0;padding:0;font-size:.9rem}
.legend li{margin:3px 0;display:flex;gap:8px;align-items:baseline}
