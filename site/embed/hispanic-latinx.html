<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambridge Civic Assembly panel: Hispanic/Latinx</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Condensed:wght@400;700&display=swap" rel="stylesheet"><style>
@font-face{font-family:"Cantabrigia";src:url("https://www.cambridgema.gov/layouts/cambridge2016/_resources/fonts/cantabrigia-bt-regular.woff2") format("woff2"),url("https://www.cambridgema.gov/layouts/cambridge2016/_resources/fonts/cantabrigia-bt-regular.woff") format("woff");font-weight:700;font-display:swap}
:root{--blue:#196CC6;--dark:#1D2F8D;--pastel:#CDECFF;--grid:#E6E6E6;--band:#D9D9D9}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans",Aptos,Arial,sans-serif;color:#000;background:#fff;line-height:1.35}
.chart{margin:0;padding:16px 18px 12px;background:#fff}
.chart h2{font-family:"Noto Sans",Aptos,Arial,sans-serif;font-weight:700;font-size:1.25rem;margin:0 0 2px}
.chart .sub{margin:0 0 12px;font-size:.875rem}
.rows{list-style:none;margin:0;padding:0}
.row{margin:0 0 10px}
.lab{font-size:.9rem;margin-bottom:3px}
.line{display:flex;align-items:center;gap:10px}
.track{position:relative;flex:1;height:26px}
.band{position:absolute;top:0;bottom:0;background:var(--band);border-left:2px solid #000;border-right:2px solid #000}
.bar{position:absolute;top:5px;bottom:5px;left:0;background:var(--blue)}
.track::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid #000}
.val{flex:0 0 5.6em;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.val b{font-weight:700}
.chart figcaption,.note{font-family:"Noto Sans Condensed","Aptos Narrow",Arial,sans-serif;font-size:.8rem;margin-top:8px}
.key{display:inline-block;width:22px;height:10px;vertical-align:middle;margin-right:4px}
.key.bar-k{background:var(--blue)}
.key.band-k{background:var(--band);border-left:2px solid #000;border-right:2px solid #000;height:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.banner{background:#FFB800;color:#000;font-weight:700;padding:6px 18px;font-size:.9rem}
.placeholder{padding:28px 18px;background:var(--pastel);font-size:1rem}
a{color:#000}
.chart.card{border:1px solid #D6DBE6;border-radius:10px;padding:18px 20px 12px}
.card h2{color:#15203B;font-size:1.3rem;margin:0 0 6px}
.pie{display:block;width:100%;height:auto;margin:0 auto}
.pie .pct{fill:#fff;font-weight:700;stroke-width:3px;paint-order:stroke;stroke-linejoin:round;font-family:"Noto Sans",Aptos,Arial,sans-serif}
.pie .lbl{fill:#15203B;font-family:"Noto Sans",Aptos,Arial,sans-serif}
.pie .leader{fill:none;stroke:#6B7389;stroke-width:1.2}
.card figcaption p{margin:4px 0 0;color:#000}
.card .src{font-size:.75rem}
.pie.narrow,.legend{display:none}
.legend{list-style:none;margin:6px 0 0;padding:0;font-size:.9rem}
.legend li{margin:3px 0;display:flex;gap:8px;align-items:baseline}
.legend .sw{flex:0 0 14px;height:14px;border-radius:3px;transform:translateY(2px)}
@media (max-width:520px){.pie.wide{display:none}.pie.narrow{display:block;max-width:240px!important}.legend{display:block}}
body{background:#F3F5F8;padding:8px}.banner{border-radius:6px;margin-bottom:8px}</style></head><body><div class="banner">TEST DATA - not actual results</div><figure class="chart card"><h2>Hispanic/Latinx</h2><svg class="pie wide" viewBox="0 0 408 275" style="max-width:408px" role="img" aria-label="Pie chart: Hispanic/Latinx" xmlns="http://www.w3.org/2000/svg"><g fill="#2978D6" stroke="#fff" stroke-width="2.5"><title>Yes: 5 of 40 (13%)</title><path d="M204.00,137.41 L204.00,25.41 A112,112 0 0 1 283.20,58.21 Z"/></g><g fill="#EB6833" stroke="#fff" stroke-width="2.5"><title>No: 35 of 40 (88%)</title><path d="M204.00,137.41 L283.20,58.21 A112,112 0 1 1 204.00,25.41 Z"/></g><text x="230.6" y="73.3" class="pct" font-size="16" stroke="#194A84" dominant-baseline="central" text-anchor="middle">13%</text><text x="177.4" y="201.6" class="pct" font-size="16" stroke="#91401F" dominant-baseline="central" text-anchor="middle">88%</text><polyline points="247.6,32.1 356.0,21.0" class="leader"/><text class="lbl" font-size="15" text-anchor="start" dominant-baseline="central"><tspan x="362.0" y="21.0">Yes</tspan></text><polyline points="160.4,242.7 52.0,253.8" class="leader"/><text class="lbl" font-size="15" text-anchor="end" dominant-baseline="central"><tspan x="46.0" y="253.8">No</tspan></text></svg><svg class="pie narrow" viewBox="0 0 248 248" style="max-width:248px" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><g fill="#2978D6" stroke="#fff" stroke-width="2.5"><title>Yes: 5 of 40 (13%)</title><path d="M124.00,124.00 L124.00,12.00 A112,112 0 0 1 203.20,44.80 Z"/></g><g fill="#EB6833" stroke="#fff" stroke-width="2.5"><title>No: 35 of 40 (88%)</title><path d="M124.00,124.00 L203.20,44.80 A112,112 0 1 1 124.00,12.00 Z"/></g><text x="150.6" y="59.8" class="pct" font-size="16" stroke="#194A84" dominant-baseline="central" text-anchor="middle">13%</text><text x="97.4" y="188.2" class="pct" font-size="16" stroke="#91401F" dominant-baseline="central" text-anchor="middle">88%</text></svg><ul class="legend" aria-hidden="true"><li><span class="sw" style="background:#2978D6"></span>Yes <b>13%</b></li><li><span class="sw" style="background:#EB6833"></span>No <b>88%</b></li></ul><div class='sr-only'><table><caption>Hispanic/Latinx</caption><thead><tr><th>Group</th><th>Panelists</th><th>Percent</th><th>Target range</th></tr></thead><tbody><tr><th scope=row>Yes</th><td>5</td><td>12.5%</td><td>3–5</td></tr><tr><th scope=row>No</th><td>35</td><td>87.5%</td><td>35–37</td></tr></tbody></table></div><figcaption><p class="src">40 panelists selected by lottery, October 5, 2026</p></figcaption></figure><script>
